# Microsoft Purview Unified Catalog Data Governance data-plane endpoints
# exercised by the connector (api-version=2026-03-20-preview).
#
# Connector flow:
#   * read_table(business_domains) -> GET /datagovernance/catalog/businessdomains
#   * read_table(data_products)    -> GET /datagovernance/catalog/dataProducts
#   * read_table(terms)            -> GET /datagovernance/catalog/terms
#   * read_table(classifications)        -> GET  /datamap/api/atlas/v2/types/typedefs
#   * read_table(classification_rules)   -> GET  /scan/classificationrules
#   * read_table(asset_classifications)  -> POST /datamap/api/search/query
#   * read_table(asset_tags)             -> POST /datamap/api/search/query
#
# Pagination:
#   All three list endpoints wrap records in a ``value`` array. Verified live:
#   ``dataProducts`` and ``terms`` page by ``skip``/``top`` and return NO
#   ``nextLink`` (they return ``count``), so they are modelled as
#   ``offset_limit`` (skip=offset, top=limit) to exercise multi-page reads.
#   ``businessdomains`` continues via ``nextLink`` (``next_link_paginate``).
#   The simulator has no nextLink style, so businessdomains uses
#   ``pagination_style: none`` (whole corpus in one ``value`` page, no
#   ``nextLink``) — the same modelling the Collibra spec uses for its cursor
#   endpoints.
#
# Cursor / termination:
#   The incremental cursor is ``systemData.lastModifiedAt`` (ISO-8601 UTC
#   string). The connector caps its returned cursor at an init-time ISO
#   snapshot. ``synthesize_future_records`` injects a few records with a
#   post-now ``lastModifiedAt`` on the two cdc endpoints so the init-time cap
#   is actually exercised and Trigger.AvailableNow termination converges.
#   ``business_domains`` is a snapshot (no cursor, no synthesis).

endpoints:
  # ---- /businessdomains (snapshot, $skipToken paginated -> nextLink) ----
  - path: "/datagovernance/catalog/businessdomains"
    method: GET
    corpus: business_domains
    response:
      pagination_style: none
      wrapper: {records_key: value}
    params:
      api-version:  {role: ignore}
      $skipToken:   {role: ignore}
      writeOnly:    {role: ignore}

  # ---- /dataProducts (cdc, systemData.lastModifiedAt, skip/top offset paging) ----
  - path: "/datagovernance/catalog/dataProducts"
    method: GET
    corpus: data_products
    response:
      pagination_style: offset_limit
      default_sort: "systemData.lastModifiedAt asc"
      wrapper: {records_key: value}
    params:
      api-version:  {role: ignore}
      skip:         {role: offset}
      top:          {role: limit, default: 100, max: 1000}
      orderBy:      {role: ignore}
      domainId:     {role: filter, field: domain, op: eq}
    synthesize_future_records:
      cursor_field: systemData.lastModifiedAt
      count: 3

  # ---- /terms (cdc, systemData.lastModifiedAt, skip/top offset paging) ----
  - path: "/datagovernance/catalog/terms"
    method: GET
    corpus: terms
    response:
      pagination_style: offset_limit
      default_sort: "systemData.lastModifiedAt asc"
      wrapper: {records_key: value}
    params:
      api-version:  {role: ignore}
      skip:         {role: offset}
      top:          {role: limit, default: 100, max: 1000}
      orderBy:      {role: ignore}
      keyword:      {role: ignore}
      depth:        {role: ignore}
      domainId:     {role: filter, field: domain, op: eq}
      parentId:     {role: filter, field: parentId, op: eq}
    synthesize_future_records:
      cursor_field: systemData.lastModifiedAt
      count: 3


  # ===================================================================== #
  # Data Map (Atlas) + Scanning endpoints (api-version=2023-09-01), served
  # from the per-account host https://{account}.purview.azure.com. The
  # simulator matches on path only, so the host comes from replay_config's
  # ``purview_account_name``. All four tables are snapshots.
  # ===================================================================== #

  # ---- classifications: typedefs filtered to classification defs ----
  - path: "/datamap/api/atlas/v2/types/typedefs"
    method: GET
    corpus: classifications
    response:
      pagination_style: none
      wrapper: {records_key: classificationDefs}
    params:
      api-version:  {role: ignore}
      type:         {role: ignore}

  # ---- classification_rules: Scanning list (nextLink continuation) ----
  # The simulator has no nextLink style; the whole corpus is served in a
  # single ``value`` page with no nextLink (same modelling as businessdomains).
  - path: "/scan/classificationrules"
    method: GET
    corpus: classification_rules
    response:
      pagination_style: none
      wrapper: {records_key: value}
    params:
      api-version:  {role: ignore}

  # ---- asset_classifications / asset_tags: Discovery search ----
  # POST body (keywords / filter / limit / continuationToken) is not
  # interpreted by the simulator; the whole corpus is returned in one
  # ``value`` page with no continuationToken, so the connector stops after
  # one call. Each record carries both ``classification[]`` and ``label[]``
  # so one corpus backs both tables.
  - path: "/datamap/api/search/query"
    method: POST
    corpus: search_assets
    response:
      pagination_style: none
      wrapper: {records_key: value}
    params:
      api-version:  {role: ignore}
